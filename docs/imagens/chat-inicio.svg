<text x="28" y="190" font-size="15" fill="#1c1c1e">✅ Pronto! Este chat foi registrado</text>
<text x="28" y="210" font-size="15" fill="#1c1c1e">como dono do assistente. Só você</text>
<text x="28" y="230" font-size="15" fill="#1c1c1e">poderá usá-lo.</text>
<text x="28" y="250" font-size="15" fill="#1c1c1e"></text>
<text x="28" y="270" font-size="15" fill="#1c1c1e">Oi! Eu cuido da sua agenda e dos</text>
<text x="28" y="290" font-size="15" fill="#1c1c1e">seus gastos. Exemplos:</text>
<text x="28" y="310" font-size="15" fill="#1c1c1e"></text>
<text x="28" y="330" font-size="15" fill="#1c1c1e">💰 &quot;gastei 32,50 no almoço&quot;</text>
<text x="28" y="350" font-size="15" fill="#1c1c1e">💰 &quot;quanto gastei com mercado esse</text>
<text x="28" y="370" font-size="15" fill="#1c1c1e">mês?&quot;</text>
<text x="28" y="390" font-size="15" fill="#1c1c1e">📷 mande a foto de um cupom ou</text>
<text x="28" y="410" font-size="15" fill="#1c1c1e">comprovante</text>
<text x="28" y="430" font-size="15" fill="#1c1c1e">📅 &quot;marca dentista sexta às 14h&quot;</text>
<text x="28" y="450" font-size="15" fill="#1c1c1e">📅 &quot;o que tenho amanhã?&quot;</text>
<text x="28" y="470" font-size="15" fill="#1c1c1e">🎤 ou mande tudo isso por áudio</text>
<text x="28" y="490" font-size="15" fill="#1c1c1e"></text>
<text x="28" y="510" font-size="15" fill="#1c1c1e">Comandos: /resumo /desfazer</text>
<text x="28" y="530" font-size="15" fill="#1c1c1e">/sincronizar /limpar /ajuda</text>
<text x="310" y="551" font-size="11" fill="#8e8e93" text-anchor="end">09:12</text>
